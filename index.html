<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Web Guidance Sandbox</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            padding: 2rem;
            background: #f4f4f9;
            margin: 0;
        }

        /* 1. Base State (Closed Sidebar) */
        dialog#sideDrawer {
            border: none;
            padding: 2rem;
            width: 250px;
            height: 100vh;
            max-height: 100vh;
            margin: 0 auto 0 0; /* Align perfectly to the left edge */
            box-shadow: 4px 0 20px rgba(0,0,0,0.15);

            /* Setup high-performance slide movement animations */
            opacity: 0;
            transform: translateX(-100%); /* Hides it off-screen to the left */
            
            /* Mandatory top-layer discrete transitions */
            transition: opacity 0.3s ease, transform 0.3s ease, display 0.3s ease allow-discrete, overlay 0.3s ease allow-discrete;
        }

        /* 2. Open State (Slide-In Sidebar) */
        dialog#sideDrawer[open] {
            opacity: 1;
            transform: translateX(0); /* Slides smoothly into active view */

            /* Handles layout tracking on clean render entries */
            @starting-style {
                opacity: 0;
                transform: translateX(-100%);
            }
        }

        /* 3. Modern Backdrop Shadow */
        dialog#sideDrawer::backdrop {
            background-color: rgba(0, 0, 0, 0);
            transition: background-color 0.3s ease, display 0.3s ease allow-discrete, overlay 0.3s ease allow-discrete;
        }

        dialog#sideDrawer[open]::backdrop {
            background-color: rgba(0, 0, 0, 0.4);
            @starting-style {
                background-color: rgba(0, 0, 0, 0);
            }
        }

        /* Generic Interactive Button Layouts */
        button {
            padding: 0.6rem 1.2rem;
            font-size: 1rem;
            cursor: pointer;
            border-radius: 4px;
            border: 1px solid #0076d6;
            background: #0076d6;
            color: white;
        }
        
        dialog button {
            background: #e0e0e0;
            color: #333;
            border: 1px solid #ccc;
            width: 100%;
        }
    </style>
</head>
<body>
